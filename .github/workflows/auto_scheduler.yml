name: Cricketslider Auto Scheduler

on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST  (02:30 UTC) -> Morning story + carousel
    - cron: "30 14 * * *"   # 20:00 IST  (14:30 UTC) -> Evening story + carousel
  workflow_dispatch:
    inputs:
      session:
        description: "Session to run"
        type: choice
        options: [auto, morning, evening]
        default: auto
      dry_run:
        description: "Render images only, do not publish"
        type: boolean
        default: true

permissions:
  contents: write            # push images to `media` branch + update data/state.json

concurrency:
  group: cricketslider
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      CONTACT: ${{ vars.CONTACT }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts + dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt

      - name: Pick session (IST)
        run: |
          S="${{ inputs.session }}"
          if [ -z "$S" ] || [ "$S" = "auto" ]; then
            if [ "$(date +%H)" -lt 14 ]; then S=morning; else S=evening; fi
          fi
          echo "SESSION=$S" >> "$GITHUB_ENV"

      - name: Fetch content
        run: python -m src.fetch_content --session "$SESSION"

      - name: Generate images
        run: python -m src.generate_images

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricketslider-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: Host images on `media` branch
        if: env.DRY_RUN != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: media
          publish_dir: ./output
          destination_dir: run_${{ github.run_id }}
          keep_files: true
          exclude_assets: "content.json,manifest.json"

      - name: Publish to Instagram
        env:
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media/run_${{ github.run_id }}
        run: python -m src.publish

      - name: Commit dedup state
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "chore: update posted state [skip ci]" && git pull --rebase && git push)
